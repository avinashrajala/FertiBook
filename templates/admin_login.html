{% extends "base.html" %}
{% block title %}Admin login{% endblock %}
{% block content %}
<section class="container auth-wrap">
  <div class="panel auth-panel">
    <h1>Admin login</h1>
    <form method="post" novalidate>
      {{ csrf_field() }}
      <label for="email">Admin email</label>
      <input type="email" id="email" name="email" value="{{ form.get('email', '') }}" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
      <button class="btn btn-primary btn-block" type="submit">Log in as admin</button>
    </form>
    <p class="auth-alt"><a href="{{ url_for('login') }}">Farmer login</a></p>
  </div>
</section>
{% endblock %}
