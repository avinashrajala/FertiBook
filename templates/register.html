{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<section class="container auth-wrap">
  <div class="panel auth-panel">
    <h1>Create farmer account</h1>
    <form method="post" id="registerForm" novalidate>
      {{ csrf_field() }}
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" value="{{ form.get('name', '') }}" minlength="2" maxlength="60" required autocomplete="name">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ form.get('email', '') }}" required autocomplete="email">

      <label for="phone">Phone number</label>
      <input type="tel" id="phone" name="phone" value="{{ form.get('phone', '') }}" inputmode="numeric" pattern="[6-9][0-9]{9}" maxlength="10" placeholder="10-digit mobile number" required autocomplete="tel">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" minlength="6" required autocomplete="new-password">
      <small class="hint">At least 6 characters, with a letter and a number.</small>

      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" name="confirm" required autocomplete="new-password">

      <button class="btn btn-primary btn-block" type="submit">Register</button>
    </form>
    <p class="auth-alt">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</section>
{% endblock %}
